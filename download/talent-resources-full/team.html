<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent Resources Myanmar - Team</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>* { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-blue-50 min-h-screen">
    <div class="flex min-h-screen">
        <aside class="w-72 bg-gradient-to-b from-slate-900 to-slate-800 text-white flex flex-col fixed h-full">
            <div class="h-20 flex items-center gap-3 px-6 border-b border-slate-700/50">
                <div class="h-12 w-12 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
                </div>
                <div><h1 class="text-lg font-bold text-white">Talent Resources</h1><p class="text-xs text-blue-300">Myanmar</p></div>
            </div>
            <nav class="flex-1 px-3 py-6">
                <a href="dashboard.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-slate-800 mb-1">Dashboard</a>
                <a href="clients.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-slate-800 mb-1">Clients</a>
                <a href="jobs.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-slate-800 mb-1">Job Orders</a>
                <a href="pipeline.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-slate-800 mb-1">Pipeline</a>
                <a href="candidates.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-slate-800 mb-1">Candidates</a>
                <a href="team.html" class="flex items-center gap-3 rounded-xl px-4 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 mb-1">Team</a>
            </nav>
        </aside>
        <main class="flex-1 ml-72">
            <header class="h-20 border-b bg-white/90 px-8 flex items-center justify-between">
                <h1 class="text-2xl font-bold text-slate-800">Team Management</h1>
                <button class="h-11 px-5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-medium">Add Team Member</button>
            </header>
            <div class="p-8">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="teamGrid"></div>
            </div>
        </main>
    </div>
    <script>
        const team = JSON.parse(localStorage.getItem('trm_team') || '[]');
        const grid = document.getElementById('teamGrid');
        team.forEach(m => {
            const progress = Math.round((m.achieved / m.target) * 100);
            const progressColor = progress >= 100 ? 'from-green-500 to-emerald-500' : progress >= 75 ? 'from-blue-500 to-indigo-500' : 'from-orange-500 to-amber-500';
            grid.innerHTML += `
                <div class="bg-white rounded-2xl shadow-lg p-6 hover:shadow-xl transition-all">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="h-14 w-14 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-lg">${m.avatar}</div>
                        <div>
                            <p class="font-bold text-slate-800">${m.name}</p>
                            <p class="text-sm text-slate-500">${m.title}</p>
                        </div>
                    </div>
                    <div class="space-y-3">
                        <div class="flex justify-between text-sm">
                            <span class="text-slate-500">Target</span>
                            <span class="font-medium text-slate-700">K ${(m.target/1000000).toFixed(0)}M</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-slate-500">Achieved</span>
                            <span class="font-medium text-green-600">K ${(m.achieved/1000000).toFixed(0)}M</span>
                        </div>
                        <div class="h-2 bg-slate-200 rounded-full overflow-hidden">
                            <div class="h-full bg-gradient-to-r ${progressColor} rounded-full" style="width:${Math.min(progress,100)}%"></div>
                        </div>
                        <div class="flex justify-between pt-3 border-t">
                            <div class="text-center"><p class="font-bold text-slate-800">${m.placements}</p><p class="text-xs text-slate-400">Placements</p></div>
                            <div class="text-center"><p class="font-bold text-green-600">K ${m.commission.toLocaleString()}</p><p class="text-xs text-slate-400">Commission</p></div>
                        </div>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
