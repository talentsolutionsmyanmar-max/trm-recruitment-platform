<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent Resources Myanmar - Pipeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>* { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-blue-50 min-h-screen">
    <div class="flex min-h-screen">
        <aside class="w-72 bg-gradient-to-b from-slate-900 to-slate-800 text-white flex flex-col fixed h-full">
            <div class="h-20 flex items-center gap-3 px-6 border-b border-slate-700/50">
                <div class="h-12 w-12 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white">Talent Resources</h1>
                    <p class="text-xs text-blue-300">Myanmar</p>
                </div>
            </div>
            <nav class="flex-1 px-3 py-6">
                <a href="dashboard.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-slate-800 mb-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6z"/></svg>Dashboard</a>
                <a href="clients.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-slate-800 mb-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>Clients</a>
                <a href="jobs.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-slate-800 mb-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>Job Orders</a>
                <a href="pipeline.html" class="flex items-center gap-3 rounded-xl px-4 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 mb-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"/></svg>Pipeline</a>
                <a href="candidates.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-slate-800 mb-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Candidates</a>
                <a href="team.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-slate-800 mb-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>Team</a>
            </nav>
        </aside>
        <main class="flex-1 ml-72">
            <header class="h-20 border-b bg-white/90 px-8 flex items-center">
                <h1 class="text-2xl font-bold text-slate-800">Sales Pipeline</h1>
            </header>
            <div class="p-8">
                <div id="kanban" class="flex gap-4 overflow-x-auto pb-4"></div>
            </div>
        </main>
    </div>
    <script>
        const deals = JSON.parse(localStorage.getItem('trm_deals') || '[]');
        const stages = [
            { id: 'lead', name: 'Lead', color: 'from-slate-400 to-slate-500' },
            { id: 'qualified', name: 'Qualified', color: 'from-blue-400 to-blue-500' },
            { id: 'proposal', name: 'Proposal', color: 'from-purple-400 to-purple-500' },
            { id: 'negotiation', name: 'Negotiation', color: 'from-orange-400 to-orange-500' },
            { id: 'won', name: 'Won', color: 'from-green-400 to-green-500' },
            { id: 'lost', name: 'Lost', color: 'from-red-400 to-red-500' }
        ];
        
        const kanban = document.getElementById('kanban');
        stages.forEach(stage => {
            const stageDeals = deals.filter(d => d.stage === stage.id);
            const total = stageDeals.reduce((s, d) => s + d.value, 0);
            kanban.innerHTML += `
                <div class="min-w-[300px] bg-slate-50 rounded-2xl p-4">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-slate-700">${stage.name}</h3>
                        <span class="bg-white px-3 py-1 rounded-full text-xs font-medium text-slate-600">${stageDeals.length}</span>
                    </div>
                    <p class="text-xs text-slate-400 mb-4">Total: K ${(total/1000000).toFixed(1)}M</p>
                    <div class="space-y-3">
                        ${stageDeals.map(d => `
                            <div class="bg-white rounded-xl p-4 shadow-sm hover:shadow-md transition-all cursor-pointer">
                                <p class="font-semibold text-slate-800 text-sm">${d.title}</p>
                                <p class="text-xs text-slate-500 mt-1">${d.clientName}</p>
                                <p class="text-sm font-bold text-green-600 mt-2">K ${(d.value/1000000).toFixed(1)}M</p>
                                <div class="flex items-center justify-between mt-3 pt-3 border-t">
                                    <span class="text-xs text-slate-400">${d.probability}%</span>
                                    <span class="text-xs text-slate-400">${d.expectedClose}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
