<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent Resources Myanmar - Candidates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>* { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-blue-50 min-h-screen">
    <div class="flex min-h-screen">
        <aside class="w-72 bg-gradient-to-b from-slate-900 to-slate-800 text-white flex flex-col fixed h-full">
            <div class="h-20 flex items-center gap-3 px-6 border-b border-slate-700/50">
                <div class="h-12 w-12 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
                </div>
                <div><h1 class="text-lg font-bold text-white">Talent Resources</h1><p class="text-xs text-blue-300">Myanmar</p></div>
            </div>
            <nav class="flex-1 px-3 py-6">
                <a href="dashboard.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-slate-800 mb-1">Dashboard</a>
                <a href="clients.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-slate-800 mb-1">Clients</a>
                <a href="jobs.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-slate-800 mb-1">Job Orders</a>
                <a href="pipeline.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-slate-800 mb-1">Pipeline</a>
                <a href="candidates.html" class="flex items-center gap-3 rounded-xl px-4 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 mb-1">Candidates</a>
                <a href="team.html" class="flex items-center gap-3 rounded-xl px-4 py-3 text-slate-300 hover:bg-slate-800 mb-1">Team</a>
            </nav>
        </aside>
        <main class="flex-1 ml-72">
            <header class="h-20 border-b bg-white/90 px-8 flex items-center justify-between">
                <h1 class="text-2xl font-bold text-slate-800">Candidates</h1>
                <button class="h-11 px-5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl font-medium">Add Candidate</button>
            </header>
            <div class="p-8">
                <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="text-left px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Candidate</th>
                                <th class="text-left px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Skills</th>
                                <th class="text-left px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Experience</th>
                                <th class="text-left px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Expected Salary</th>
                                <th class="text-left px-6 py-4 text-xs font-semibold text-slate-500 uppercase">Status</th>
                            </tr>
                        </thead>
                        <tbody id="candidatesTable" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script>
        const candidates = JSON.parse(localStorage.getItem('trm_candidates') || '[]');
        const table = document.getElementById('candidatesTable');
        candidates.forEach(c => {
            const statusClass = c.status === 'available' ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-600';
            table.innerHTML += `
                <tr class="hover:bg-slate-50">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <div class="h-10 w-10 rounded-full bg-gradient-to-br from-blue-400 to-indigo-500 flex items-center justify-center text-white font-medium">${c.name.split(' ').map(w=>w[0]).join('')}</div>
                            <div><p class="font-semibold text-slate-800">${c.name}</p><p class="text-sm text-slate-500">${c.email}</p></div>
                        </div>
                    </td>
                    <td class="px-6 py-4"><div class="flex flex-wrap gap-1">${c.skills.slice(0,2).map(s=>`<span class="px-2 py-1 bg-slate-100 rounded text-xs">${s}</span>`).join('')}</div></td>
                    <td class="px-6 py-4 text-slate-600">${c.experience} years</td>
                    <td class="px-6 py-4 font-medium text-green-600">K ${c.expectedSalary.toLocaleString()}</td>
                    <td class="px-6 py-4"><span class="px-3 py-1 rounded-full text-xs font-medium ${statusClass}">${c.status}</span></td>
                </tr>
            `;
        });
    </script>
</body>
</html>
